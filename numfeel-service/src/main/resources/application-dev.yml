spring:
  graphql:
    graphiql:
      enabled: true
  r2dbc:
    url: r2dbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:demomockserver-dev}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    pool:
      initial-size: 1
      max-size: 5
      max-idle-time: 30m
  sql:
    init:
      mode: never

server:
  port: 8080

logging:
  level:
    root: INFO
    # Demo talk-through logging, kept in the dev profile only so the default profile stays quiet.
    # HttpWebHandlerAdapter logs one line per HTTP request plus its completion status.
    # org.springframework.r2dbc.core logs every SQL statement the server executes, which makes the
    # SQL-call counts shown in the UI verifiable in the console. Remove both lines for a quiet run.
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: DEBUG
    org.springframework.r2dbc.core: DEBUG
    io.netty: WARN
    io.r2dbc: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
